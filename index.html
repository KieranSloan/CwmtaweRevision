<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Hub</title>
<style>
:root{--bg:#FBF6EA;--card:#fff;--ink:#1d2433;--soft:#5b6475;--blue:#1d4ed8;--blue2:#e0e9ff;--green:#15803d;--green2:#dcfce7;--red:#b91c1c;--red2:#fee2e2;--amber:#fff1c2;--line:#e3dccb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:Verdana,"Trebuchet MS",Arial,sans-serif;font-size:18px;line-height:1.6;letter-spacing:.01em;-webkit-text-size-adjust:100%;overflow-x:hidden}
body.big{font-size:21px}
header{position:sticky;top:0;background:#1e3a8a;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;z-index:5}
header h1{font-size:1.05rem;margin:0;flex:1;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.menu-btn{background:none!important;border:none;color:#fff;font-size:1.5rem!important;padding:0 8px 0 0!important}
main{max-width:680px;margin:0 auto;padding:16px 16px 60px}

/* Sidebar Styles */
.sidebar{position:fixed;top:0;left:-270px;width:270px;height:100%;background:#1e3a8a;color:#fff;transition:left 0.28s ease;z-index:10;padding:18px 0;box-shadow:2px 0 12px rgba(0,0,0,0.35);overflow-y:auto}
.sidebar.open{left:0}
.sidebar h2{padding:0 20px;margin:0 0 12px;font-size:1.3rem;color:#e0e9ff}
.sidebar a{display:flex;align-items:center;gap:12px;padding:13px 20px;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.1);cursor:pointer;font-size:1.02rem}
.sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,0.2);border-left:4px solid #fff;padding-left:16px}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9;display:none;opacity:0;transition:opacity 0.25s ease}
.overlay.open{display:block;opacity:1}

/* App Styles */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
h2{font-size:1.3rem;margin:.1em 0 .5em}
h3{font-size:1.08rem;margin:1em 0 .3em}
p{margin:.4em 0 .7em}
.btn{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 16px;margin:0 0 10px;font:inherit;color:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);text-align:center;font-weight:bold}
.btn.ghost{text-align:center;background:transparent}
.btn small{display:block;color:var(--soft);font-size:.82rem;line-height:1.4}
.menu .btn{display:flex;gap:14px;align-items:center}
.menu .ico{font-size:1.7rem;width:2.3rem;text-align:center;flex:none}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sub-grid .btn{margin:0;display:flex;gap:14px;align-items:center}
.sub-grid .ico{font-size:2rem;width:2.5rem;text-align:center;flex:none}
.badge{display:inline-block;background:var(--blue2);color:var(--blue);font-weight:bold;border-radius:999px;padding:2px 9px;font-size:.75rem;margin-top:4px}
.badge.soon{background:#fef3c7;color:#b45309}
.badge.urgent{background:var(--red2);color:var(--red)}
.badge.done{background:var(--green2);color:var(--green)}
.opt.sel{border-color:var(--blue);background:var(--blue2)}
.opt.right{border-color:var(--green);background:var(--green2)}
.opt.wrong{border-color:var(--red);background:var(--red2)}
.fb{border-radius:12px;padding:12px 14px;margin:10px 0}
.fb.good{background:var(--green2);border:2px solid #86efac}
.fb.bad{background:var(--red2);border:2px solid #fca5a5}
.tag{display:inline-block;background:var(--amber);border-radius:999px;padding:2px 10px;font-size:.78rem}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.speak{background:var(--blue2);border:0;border-radius:10px;padding:6px 10px;font:inherit;font-size:.8rem;color:var(--blue);cursor:pointer}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .3s}
.qtext{font-size:1.08em;font-weight:bold;margin:10px 0}
svg.app{width:96px;height:116px}
svg.mid{width:150px;height:auto}
svg.chart{width:100%;height:auto;background:#fff;border-radius:10px;border:1px solid var(--line);touch-action:manipulation}
.qimg{text-align:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.eq{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:.85rem;line-height:1.4}
.eq b{display:block;font-size:.95rem;margin:2px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
td,th{border:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
th{background:var(--blue2)}
.tip{background:var(--amber);border-radius:12px;padding:10px 14px;margin:10px 0}
.key{background:var(--blue2);border-radius:12px;padding:10px 14px;margin:10px 0}
input.num{font:inherit;font-size:1.3rem;padding:10px;border:2px solid var(--line);border-radius:12px;width:8.5rem}
input.txt{font:inherit;font-size:1.3rem;padding:10px;border:2px solid var(--line);border-radius:12px;width:100%}
.unit{font-size:1.15rem;margin-left:6px}
.flash{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.flash svg.app{width:150px;height:180px}
ul{padding-left:1.2em;margin:.3em 0}
li{margin:.35em 0}
a{color:var(--blue)}
.big-score{font-size:2.6rem;font-weight:bold;text-align:center;margin:4px 0}
.bar{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%}
.small{font-size:.85rem;color:var(--soft)}
.pill{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px;font-size:.85rem;background:#fff;cursor:pointer}
</style>
</head>
<body>

<!-- Slide-out Sidebar -->
<div class="sidebar" id="sidebar">
  <h2>📚 Revision Hub</h2>
  <a onclick="goLanding()" id="nav-home">🏠 All Subjects</a>
  <a onclick="selectSubject('science')" id="nav-science">🔬 Science</a>
  <a onclick="selectSubject('welsh')" id="nav-welsh">🏴󠁧󠁢󠁷󠁬󠁳󠁿 Welsh</a>
  <a onclick="selectSubject('english')" id="nav-english">📖 English</a>
  <a onclick="selectSubject('maths')" id="nav-maths">📐 Maths</a>
  <a onclick="selectSubject('french')" id="nav-french">🥐 French</a>
  <a onclick="selectSubject('dt')" id="nav-dt">🛠️ Design Tech</a>
  <a onclick="selectSubject('history')" id="nav-history">🏛️ History</a>
  <a onclick="selectSubject('german')" id="nav-german">🥨 German</a>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<header>
  <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <h1 onclick="headerClick()" id="header-title">🎓 Revision Hub</h1>
  <button onclick="toggleBig()" aria-label="Change text size">A+</button>
  <button onclick="goLanding()">Subjects</button>
</header>
<main id="app"></main>

<script>
/* ============ HELPERS & STATE ============ */
const app = document.getElementById('app');
function show(html){ app.innerHTML = html; window.scrollTo(0,0); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function toggleBig(){ document.body.classList.toggle('big'); store('big',document.body.classList.contains('big')); }
if(store('big')) document.body.classList.add('big');

let currentSubject = null;
let currentExam = null;

/*
 * SUBJECTS & EXAMS DIRECTORY
 * Add new exams to any subject's `exams` array!
 * Use YYYY-MM-DD for `date` so it sorts automatically with the next exam first.
 */
const SUBJECTS = {
  science: {
    name: 'Science', ico: '🔬',
    exams: [
      { id: 'sci-apparatus', title: 'Apparatus & Graphs Test', date: '2026-11-10', dateText: 'Tuesday 10th November 2026', desc: 'Lab equipment, units, reading scales, bar charts & line graphs' }
    ]
  },
  welsh: {
    name: 'Welsh', ico: '🏴󠁧󠁢󠁷󠁬󠁳󠁿',
    exams: [
      { id: 'welsh-months', title: 'Vocabulary Test: Months of the Year', date: '2026-11-11', dateText: 'Wednesday 11th November 2026', desc: 'Translate English months into Welsh with correct spelling (Miss C Evans)' }
    ]
  },
  english: { name: 'English', ico: '📖', exams: [] },
  maths:   { name: 'Maths', ico: '📐', exams: [] },
  french:  { name: 'French', ico: '🥐', exams: [] },
  dt:      { name: 'Design Tech', ico: '🛠️', exams: [] },
  history: { name: 'History', ico: '🏛️', exams: [] },
  german:  { name: 'German', ico: '🥨', exams: [] }
};

function getSortedExams(subKey) {
  const list = (SUBJECTS[subKey]?.exams || []).slice();
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = [], past = [];
  list.forEach(ex => {
    const d = new Date(ex.date + 'T00:00:00');
    const diffDays = Math.round((d - today) / 86400000);
    const item = { ...ex, diffDays };
    if (diffDays >= 0) upcoming.push(item);
    else past.push(item);
  });
  upcoming.sort((a,b) => a.diffDays - b.diffDays);
  past.sort((a,b) => b.diffDays - a.diffDays);
  return { upcoming, past };
}

function countdownBadge(diffDays) {
  if (diffDays === 0) return `<span class="badge urgent">🔥 Exam is TODAY!</span>`;
  if (diffDays === 1) return `<span class="badge urgent">⏰ Tomorrow!</span>`;
  if (diffDays > 1 && diffDays <= 7) return `<span class="badge soon">⏳ In ${diffDays} days</span>`;
  if (diffDays > 7) return `<span class="badge">📅 In ${diffDays} days</span>`;
  return `<span class="badge" style="background:#eee;color:#555">Past exam (${Math.abs(diffDays)}d ago)</span>`;
}

/* Sidebar Controls */
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (sb.classList.contains('open')) { closeSidebar(); }
  else {
    sb.classList.add('open');
    ov.style.display = 'block';
    setTimeout(() => ov.classList.add('open'), 10);
  }
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  const ov = document.getElementById('overlay');
  ov.classList.remove('open');
  setTimeout(() => ov.style.display = 'none', 260);
}
function updateNavHighlight() {
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  if (!currentSubject) document.getElementById('nav-home')?.classList.add('active');
  else document.getElementById('nav-' + currentSubject)?.classList.add('active');
}
function headerClick() {
  if (currentExam) examHome();
  else if (currentSubject) selectSubject(currentSubject);
  else goLanding();
}

/* ============ 1. LANDING HOMEPAGE (CHOOSE SUBJECT EVERY TIME) ============ */
function goLanding() {
  SPEAK = [];
  currentSubject = null;
  currentExam = null;
  closeSidebar();
  updateNavHighlight();
  document.getElementById('header-title').innerHTML = `🎓 Revision Hub`;

  let allUpcoming = [];
  Object.entries(SUBJECTS).forEach(([k, sub]) => {
    const { upcoming } = getSortedExams(k);
    upcoming.forEach(ex => allUpcoming.push({ ...ex, subKey: k, subName: sub.name, subIco: sub.ico }));
  });
  allUpcoming.sort((a,b) => a.diffDays - b.diffDays);

  let upHtml = '';
  if (allUpcoming.length) {
    upHtml = `<div class="card">
      <h3 style="margin-top:0">📅 Next Up (Closest Exams First)</h3>
      <div class="menu">
        ${allUpcoming.map(ex => `
          <button class="btn" onclick="openExam('${ex.subKey}','${ex.id}')" style="margin-bottom:8px">
            <span class="ico">${ex.subIco}</span>
            <span>
              <b>${esc(ex.subName)}: ${esc(ex.title)}</b>
              <small>${esc(ex.dateText)}</small>
              ${countdownBadge(ex.diffDays)}
            </span>
          </button>
        `).join('')}
      </div>
    </div>`;
  }

  const subCards = Object.entries(SUBJECTS).map(([k, s]) => {
    const { upcoming, past } = getSortedExams(k);
    const total = upcoming.length + past.length;
    let info = `<small>No exams added yet</small>`;
    if (upcoming.length) {
      info = `<small>Next: <b>${esc(upcoming[0].title)}</b> (${esc(upcoming[0].dateText)})</small>${countdownBadge(upcoming[0].diffDays)}`;
    } else if (past.length) {
      info = `<small>${total} past exam${total>1?'s':''} available to practise</small>`;
    }
    return `<button class="btn" onclick="selectSubject('${k}')">
      <span class="ico">${s.ico}</span>
      <span><b>${esc(s.name)}</b>${info}</span>
    </button>`;
  }).join('');

  show(`
    <div class="card">
      <h2>👋 Welcome! Choose a subject to revise</h2>
      <p class="small">Pick a subject below or jump straight into your next upcoming test.</p>
    </div>
    ${upHtml}
    <h2>📚 Subjects</h2>
    <div class="sub-grid">${subCards}</div>
  `);
}

/* ============ 2. SUBJECT PAGE (LISTS EXAMS ORDERED BY NEXT EXAM FIRST) ============ */
function selectSubject(subKey) {
  SPEAK = [];
  currentSubject = subKey;
  currentExam = null;
  closeSidebar();
  updateNavHighlight();
  const s = SUBJECTS[subKey];
  document.getElementById('header-title').innerHTML = `${s.ico} ${s.name}`;

  const { upcoming, past } = getSortedExams(subKey);

  if (!upcoming.length && !past.length) {
    show(`
      <div class="card">
        <h2>${s.ico} ${esc(s.name)} – Exams</h2>
        <p>No exams or revision topics have been added for <b>${esc(s.name)}</b> yet.</p>
        <p class="small">Check back soon when new homework or test dates are announced!</p>
      </div>
      <button class="btn ghost" onclick="goLanding()">← Back to All Subjects</button>
    `);
    return;
  }

  let html = `<div class="card">
    <h2>${s.ico} ${esc(s.name)} Exams</h2>
    <p class="small">Ordered with the next upcoming exam at the top. Tap an exam to start revising.</p>
  </div>`;

  if (upcoming.length) {
    html += `<h3>⏳ Upcoming Exams</h3><div class="menu">`;
    upcoming.forEach(ex => {
      const best = store('bestTest_' + ex.id);
      html += `<button class="btn" onclick="openExam('${subKey}','${ex.id}')">
        <span class="ico">📝</span>
        <span>
          <b>${esc(ex.title)}</b>
          <small>📆 <b>${esc(ex.dateText)}</b> — ${esc(ex.desc)}</small>
          ${countdownBadge(ex.diffDays)}
          ${best!=null ? `<span class="badge done">⭐ Best Mock: ${best}%</span>` : ''}
        </span>
      </button>`;
    });
    html += `</div>`;
  }

  if (past.length) {
    html += `<h3>✅ Past Exams (Still open for revision)</h3><div class="menu">`;
    past.forEach(ex => {
      const best = store('bestTest_' + ex.id);
      html += `<button class="btn" onclick="openExam('${subKey}','${ex.id}')">
        <span class="ico">📂</span>
        <span>
          <b>${esc(ex.title)}</b>
          <small>📆 ${esc(ex.dateText)} — ${esc(ex.desc)}</small>
          ${countdownBadge(ex.diffDays)}
          ${best!=null ? `<span class="badge done">⭐ Best Mock: ${best}%</span>` : ''}
        </span>
      </button>`;
    });
    html += `</div>`;
  }

  html += `<button class="btn ghost" onclick="goLanding()">← Back to All Subjects</button>`;
  show(html);
}

function openExam(subKey, examId) {
  currentSubject = subKey;
  currentExam = examId;
  closeSidebar();
  updateNavHighlight();
  examHome();
}

function home() {
  if (currentExam) examHome();
  else if (currentSubject) selectSubject(currentSubject);
  else goLanding();
}

/* ============ 3. EXAM DASHBOARD ============ */
function examHome() {
  SPEAK = [];
  if (!currentSubject || !currentExam) { goLanding(); return; }
  const sub = SUBJECTS[currentSubject];
  const ex = sub.exams.find(e => e.id === currentExam);
  document.getElementById('header-title').innerHTML = `${sub.ico} ${ex.title}`;
  const best = store('bestTest_' + currentExam);

  if (currentExam === 'sci-apparatus') {
    show(`
    <div class="card">
      <h2>🔬 ${esc(ex.title)} 👋</h2>
      <p>Test date: <b>${esc(ex.dateText)}</b>.</p>
      <p class="small">Best plan: <b>1.</b> Learn → <b>2.</b> Flashcards → <b>3.</b> Practise → <b>4.</b> Graph Lab → <b>5.</b> Mock test.</p>
      ${best!=null?`<p class="tip">⭐ Your best mock test score: <b>${best}%</b></p>`:''}
    </div>
    <div class="menu">
      <button class="btn" onclick="learnMenu()"><span class="ico">📖</span><span><b>1. Learn</b><small>Short notes and pictures for each topic</small></span></button>
      <button class="btn" onclick="flashStart()"><span class="ico">🃏</span><span><b>2. Equipment flashcards</b><small>See the picture. Can you name it? Tap to check.</small></span></button>
      <button class="btn" onclick="practiceMenu()"><span class="ico">✏️</span><span><b>3. Practise a topic</b><small>Answer questions. Get help straight away.</small></span></button>
      <button class="btn" onclick="labMenu()"><span class="ico">📈</span><span><b>4. Graph Lab</b><small>Draw real bar charts and line graphs</small></span></button>
      <button class="btn" onclick="startTest()"><span class="ico">📝</span><span><b>5. Mock test</b><small>25 questions, like the real thing. Marks at the end.</small></span></button>
      <button class="btn" onclick="tips()"><span class="ico">🏆</span><span><b>Top marks tips</b><small>How to get every mark</small></span></button>
      <button class="btn" onclick="videos()"><span class="ico">🎬</span><span><b>Videos</b><small>Free video lessons (needs internet)</small></span></button>
    </div>
    <button class="btn ghost" onclick="selectSubject('${currentSubject}')">← Back to ${esc(sub.name)} Exams</button>`);
  } else if (currentExam === 'welsh-months') {
    show(`
    <div class="card">
      <h2>🏴󠁧󠁢󠁷󠁬󠁳󠁿 ${esc(ex.title)} 👋</h2>
      <p>Test date: <b>${esc(ex.dateText)}</b>.</p>
      <p class="small">You will be given the months in English in random order and will need to write out the Welsh months. Spelling is important!</p>
      ${best!=null?`<p class="tip">⭐ Your best mock test score: <b>${best}%</b></p>`:''}
    </div>
    <div class="menu">
      <button class="btn" onclick="learn('months')"><span class="ico">📖</span><span><b>1. Learn the Months</b><small>Full table of English to Welsh months + tips</small></span></button>
      <button class="btn" onclick="flashStart()"><span class="ico">🃏</span><span><b>2. Flashcards</b><small>See the English month, tap to check the Welsh</small></span></button>
      <button class="btn" onclick="practise('months-mc')"><span class="ico">🎯</span><span><b>3. Quick Multiple Choice</b><small>Warm up by picking the right Welsh month</small></span></button>
      <button class="btn" onclick="practise('months')"><span class="ico">✏️</span><span><b>4. Practise Spelling</b><small>Type the Welsh months with instant feedback</small></span></button>
      <button class="btn" onclick="startTest()"><span class="ico">📝</span><span><b>5. Full Mock Test (All 12 Months)</b><small>Random order spelling test just like class</small></span></button>
    </div>
    <button class="btn ghost" onclick="selectSubject('${currentSubject}')">← Back to ${esc(sub.name)} Exams</button>`);
  }
}

/* Read aloud */
function sayText(t, langOverride){
  if(!('speechSynthesis' in window)){ alert('Read aloud is not available on this phone.'); return; }
  t = t.replace(/<[^>]+>/g,' ')
       .replace(/cm³/g,' centimetres cubed').replace(/°C/g,' degrees Celsius')
       .replace(/\(N\)/g,'(newtons)').replace(/\(g\)/g,'(grams)').replace(/\(s\)/g,'(seconds)')
       .replace(/\(cm\)/g,'(centimetres)').replace(/\(min\)/g,'(minutes)').replace(/x-axis/g,'x axis').replace(/y-axis/g,'y axis');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = langOverride || (currentSubject === 'welsh' ? 'cy-GB' : 'en-GB');
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
let SPEAK = [];
function speakBtn(text){ SPEAK.push(text); return `<button class="speak" onclick="sayText(SPEAK[${SPEAK.length-1}])">🔊 Read to me</button>`; }

/* ============ WELSH DATA ============ */
const WELSH_MONTHS = [
  {en: 'January', cy: 'Ionawr'},
  {en: 'February', cy: 'Chwefror'},
  {en: 'March', cy: 'Mawrth'},
  {en: 'April', cy: 'Ebrill'},
  {en: 'May', cy: 'Mai'},
  {en: 'June', cy: 'Mehefin'},
  {en: 'July', cy: 'Gorffennaf'},
  {en: 'August', cy: 'Awst'},
  {en: 'September', cy: 'Medi'},
  {en: 'October', cy: 'Hydref'},
  {en: 'November', cy: 'Tachwedd'},
  {en: 'December', cy: 'Rhagfyr'}
];

/* ============ CHART DRAWING ENGINE ============ */
function fmt(v){ return Math.round(v*100)/100; }
function chart(o){
  const Wd=o.w||340, Ht=o.h||255, L=54, R=14, T=o.title?30:14, B=50;
  const pw=Wd-L-R, ph=Ht-T-B, yMin=o.yMin||0;
  const Y=v=>T+ph-(v-yMin)/(o.yMax-yMin)*ph;
  let s=`<svg class="chart" viewBox="0 0 ${Wd} ${Ht}" ${o.id?`id="${o.id}"`:''} font-family="Verdana" font-size="11">`;
  if(o.title) s+=`<text x="${L+pw/2}" y="18" text-anchor="middle" font-weight="bold" font-size="12" fill="#1d2433">${esc(o.title)}</text>`;
  const minor = o.yMinor;
  if(minor){ for(let v=yMin; v<=o.yMax+1e-9; v+=minor) s+=`<line x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef2f7"/>`; }
  for(let v=yMin; v<=o.yMax+1e-9; v+=o.yStep){ s+=`<line x1="${L}" x2="${L+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#d6dde8"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="#333">${fmt(v)}</text>`; }
  const geo={L,T,pw,ph,Y,yMin,yMax:o.yMax};
  if(o.type==='bar'){
    const n=o.labels.length, band=pw/n, bw=o.noGaps?band:band*0.6;
    geo.band=band;
    o.labels.forEach((lab,i)=>{
      const cx=L+band*i+band/2;
      if(o.ys && o.ys[i]!=null && o.ys[i]>yMin) s+=`<rect x="${cx-bw/2}" y="${Y(o.ys[i])}" width="${bw}" height="${Y(yMin)-Y(o.ys[i])}" fill="${o.colour||'#5b8def'}" stroke="#1d3557" stroke-width="1.2"/>`;
      if(!o.hideCats) s+=`<text x="${cx}" y="${T+ph+16}" text-anchor="middle" fill="#333" font-size="10.5">${esc(lab)}</text>`;
    });
  } else {
    const xMin=o.xMin||0, X=v=>L+(v-xMin)/(o.xMax-xMin)*pw;
    geo.X=X; geo.xMin=xMin; geo.xMax=o.xMax;
    for(let v=xMin; v<=o.xMax+1e-9; v+=o.xStep){ s+=`<line y1="${T}" y2="${T+ph}" x1="${X(v)}" x2="${X(v)}" stroke="#d6dde8"/><text x="${X(v)}" y="${T+ph+16}" text-anchor="middle" fill="#333">${fmt(v)}</text>`; }
    if(o.fit){ let pts=[]; const a=o.fitFrom??xMin, b=o.fitTo??o.xMax; for(let i=0;i<=60;i++){ const x=a+(b-a)*i/60; pts.push(`${X(x)},${Y(o.fit(x))}`);} s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#e76f51" stroke-width="2.2"/>`; }
    if(o.join){ s+=`<polyline points="${o.xs.map((x,i)=>X(x)+','+Y(o.ys[i])).join(' ')}" fill="none" stroke="#e76f51" stroke-width="2"/>`; }
    if(o.xs && o.ys) o.xs.forEach((x,i)=>{ const px=X(x), py=Y(o.ys[i]); s+=`<path d="M${px-5} ${py-5}L${px+5} ${py+5}M${px+5} ${py-5}L${px-5} ${py+5}" stroke="#1d3557" stroke-width="2.2"/>`; if(o.ring===i) s+=`<circle cx="${px}" cy="${py}" r="11" fill="none" stroke="#b91c1c" stroke-width="2"/>`; });
  }
  s+=`<path d="M${L} ${T} V${T+ph} H${L+pw}" stroke="#1d2433" stroke-width="2" fill="none"/>`;
  if(o.xL && !o.hideX) s+=`<text x="${L+pw/2}" y="${Ht-10}" text-anchor="middle" font-weight="bold" fill="#1d2433">${esc(o.xL)}</text>`;
  if(o.yL && !o.hideY) s+=`<text transform="translate(14 ${T+ph/2}) rotate(-90)" text-anchor="middle" font-weight="bold" fill="#1d2433">${esc(o.yL)}</text>`;
  s+=`<g id="${o.id?o.id+'-marks':'m'}"></g></svg>`;
  o._geo=geo;
  return s;
}

function cylinderScale(v,max,minor,major){
  const top=20,bot=230,yy=x=>bot-x/max*(bot-top);
  let s=`<svg class="mid" viewBox="0 0 150 260" font-family="Verdana" font-size="11">`;
  const y=yy(v);
  s+=`<path d="M50 ${y-5} Q70 ${y+5} 90 ${y-5} L90 ${bot} L50 ${bot} Z" fill="#a8dadc"/>`;
  for(let m=0;m<=max+1e-9;m+=minor){ const isM=Math.abs(m/major-Math.round(m/major))<1e-6; s+=`<line x1="50" x2="${isM?66:58}" y1="${yy(m)}" y2="${yy(m)}" stroke="#1d3557" stroke-width="${isM?1.6:1}"/>`; if(isM && m>0) s+=`<text x="96" y="${yy(m)+4}" fill="#1d3557">${m}</text>`; }
  s+=`<path d="M46 12 L50 16 L50 ${bot} L90 ${bot} L90 14" stroke="#1d3557" stroke-width="2.5" fill="none"/><rect x="36" y="${bot}" width="68" height="10" fill="none" stroke="#1d3557" stroke-width="2.5"/>`;
  s+=`<text x="96" y="12" fill="#1d3557">cm³</text></svg>`;
  return s;
}
function thermoScale(v,lo,hi,minor,major){
  const top=20,bot=220,yy=x=>bot-(x-lo)/(hi-lo)*(bot-top);
  let s=`<svg class="mid" viewBox="0 0 150 270" font-family="Verdana" font-size="11">`;
  s+=`<rect x="70" y="${yy(v)}" width="10" height="${250-yy(v)}" fill="#e63946"/><circle cx="75" cy="248" r="14" fill="#e63946" stroke="#1d3557" stroke-width="2.5"/>`;
  s+=`<rect x="66" y="10" width="18" height="230" rx="9" fill="none" stroke="#1d3557" stroke-width="2.5"/>`;
  for(let m=lo;m<=hi+1e-9;m+=minor){ const isM=Math.abs((m-lo)/major-Math.round((m-lo)/major))<1e-6; s+=`<line x1="84" x2="${isM?98:91}" y1="${yy(m)}" y2="${yy(m)}" stroke="#1d3557" stroke-width="${isM?1.6:1}"/>`; if(isM) s+=`<text x="102" y="${yy(m)+4}" fill="#1d3557">${m}</text>`; }
  s+=`<text x="102" y="12" fill="#1d3557">°C</text></svg>`;
  return s;
}

function staticFor(topic){ return STATIC.map(f=>f()).filter(q=>q.topic===topic); }
function makeQs(topic,n){
  if (topic === 'months') {
    let items = shuffle(WELSH_MONTHS);
    return items.slice(0, n).map(item => ({
      type: 'text',
      topic: 'months',
      q: `Write the Welsh month for "${item.en}":`,
      ans: item.cy,
      why: `${item.en} in Welsh is "${item.cy}".`
    }));
  }
  if (topic === 'months-mc') {
    let items = shuffle(WELSH_MONTHS);
    return items.slice(0, n).map(item => {
      const wrongs = shuffle(WELSH_MONTHS.filter(x => x.cy !== item.cy)).slice(0, 3).map(x => x.cy);
      return MC('months-mc', `What is "${item.en}" in Welsh?`, item.cy, wrongs, `${item.en} = ${item.cy}.`);
    });
  }

  let st=shuffle(staticFor(topic)); const gens=GEN[topic]||[];
  let out=[]; let gi=0;
  while(out.length<n){
    if(gens.length && (out.length%2===1 || !st.length)){ out.push(gens[gi%gens.length]()); gi++; }
    else if(st.length){ out.push(st.pop()); }
    else break;
  }
  return shuffle(out);
}

let QZ=null;
function practiceMenu(){
  SPEAK=[];
  show(`<h2>✏️ Practise a topic</h2><p>10 questions. You'll see the right answer and why after each one.</p>
  <div class="menu">${Object.entries(SCIENCE_TOPICS).map(([k,t])=>`<button class="btn" onclick="practise('${k}')"><span class="ico">${t.ico}</span><span><b>${t.name}</b></span></button>`).join('')}
  <button class="btn" onclick="practise('mix')"><span class="ico">🎲</span><span><b>Mixed – all topics</b></span></button></div>
  <button class="btn ghost" onclick="examHome()">← Back</button>`);
}
function practise(k){
  let qs;
  if (k === 'mix') qs = shuffle(Object.keys(SCIENCE_TOPICS).flatMap(t=>makeQs(t,3))).slice(0,12);
  else if (k === 'months' || k === 'months-mc') qs = makeQs(k, 12);
  else qs = makeQs(k, 10);
  QZ={mode:'practice',topic:k,qs,i:0,score:0,answers:[],done:false};
  renderQ();
}
function startTest(){
  let qs=[];
  if (currentExam === 'welsh-months') {
    qs = makeQs('months', 12);
  } else {
    const per={equip:5,units:5,choose:4,bar:3,line:4,trends:4};
    for(const t in per) qs=qs.concat(makeQs(t,per[t]));
    qs = shuffle(qs);
  }
  QZ={mode:'test',qs,i:0,score:0,answers:[],done:false};
  show(`<h2>📝 Mock test</h2><div class="card"><p>There are <b>${qs.length} questions</b>.</p><ul><li>Read each question <b>twice</b>.</li><li>You won't see the answers until the end – just like a real test.</li><li>Take your time. You've got this! 💪</li></ul></div>
  <button class="btn primary" onclick="renderQ()">Start the test</button><button class="btn ghost" onclick="examHome()">← Back</button>`);
}

function renderQ() {
  SPEAK = [];
  const q = QZ.qs[QZ.i]; 
  QZ.sel = null; 
  QZ.done = false;
  const pct = Math.round(QZ.i / QZ.qs.length * 100);
  const tInfo = ALL_TOPICS[q.topic] || { ico: '❓', name: 'Question' };
  let body = '';
  
  if (q.type === 'mc') {
    body = q.opts.map((o, i) => `<button class="btn opt" id="o${i}" onclick="choose(${i})">${String.fromCharCode(65 + i)}. ${esc(o)}</button>`).join('');
  } else if (q.type === 'num') {
    body = `<div class="row" style="justify-content:flex-start"><input class="num" id="numIn" inputmode="decimal" autocomplete="off" placeholder="?" onkeydown="if(event.key==='Enter')submitNum()"><span class="unit">${q.unit}</span></div><div style="height:10px"></div><button class="btn primary" id="numBtn" onclick="submitNum()">${QZ.mode === 'test' ? 'Next →' : 'Check answer'}</button>`;
  } else if (q.type === 'text') {
    body = `<input class="txt" id="txtIn" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Type Welsh month..." onkeydown="if(event.key==='Enter')submitText()"><div style="height:10px"></div><button class="btn primary" id="txtBtn" onclick="submitText()">${QZ.mode === 'test' ? 'Next →' : 'Check spelling'}</button>`;
  }
  
  const readText = q.q + (q.type === 'mc' ? ' ' + q.opts.map((o, i) => String.fromCharCode(65 + i) + '. ' + o).join('. ') : '');
  
  show(`<div class="row"><span class="tag">${tInfo.ico} ${tInfo.name}</span><span class="small">Q ${QZ.i + 1} of ${QZ.qs.length}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="card"><div class="row"><span></span>${speakBtn(readText)}</div>
  <p class="qtext">${esc(q.q)}</p>${q.img ? `<div class="qimg">${q.img}</div>` : ''}${body}<div id="fb"></div></div>
  <button class="btn ghost" onclick="if(confirm('Stop and return to exam page?'))examHome()">Stop</button>`);
  
  if (q.type === 'text') setTimeout(() => document.getElementById('txtIn')?.focus(), 80);
}

function choose(i) {
  if (QZ.done) return;
  const q = QZ.qs[QZ.i];
  if (QZ.mode === 'test') {
    QZ.answers.push({ q, given: q.opts[i], ok: i === q.correct }); 
    if (i === q.correct) QZ.score++;
    document.getElementById('o' + i).classList.add('sel'); 
    QZ.done = true;
    setTimeout(nextQ, 350); 
    return;
  }
  QZ.done = true; 
  const ok = i === q.correct; 
  if (ok) QZ.score++;
  QZ.answers.push({ q, given: q.opts[i], ok });
  document.getElementById('o' + q.correct).classList.add('right');
  if (!ok) document.getElementById('o' + i).classList.add('wrong');
  feedback(ok, q, q.opts[q.correct]);
}

function submitNum() {
  if (QZ.done) return;
  const q = QZ.qs[QZ.i]; 
  const raw = document.getElementById('numIn').value.trim();
  if (raw === '') { document.getElementById('numIn').focus(); return; }
  const v = parseFloat(raw.replace(',', '.')); 
  const ok = !isNaN(v) && Math.abs(v - q.ans) <= q.tol + 1e-9;
  QZ.done = true; 
  if (ok) QZ.score++; 
  QZ.answers.push({ q, given: raw + ' ' + q.unit, ok });
  if (QZ.mode === 'test') { nextQ(); return; }
  document.getElementById('numBtn').style.display = 'none';
  feedback(ok, q, q.ans + ' ' + q.unit);
}

function submitText() {
  if (QZ.done) return;
  const q = QZ.qs[QZ.i]; 
  const raw = document.getElementById('txtIn').value.trim();
  if (raw === '') { document.getElementById('txtIn').focus(); return; }
  const ok = raw.toLowerCase() === q.ans.toLowerCase();
  QZ.done = true; 
  if (ok) QZ.score++; 
  QZ.answers.push({ q, given: raw, ok });
  if (QZ.mode === 'test') { nextQ(); return; }
  document.getElementById('txtBtn').style.display = 'none';
  feedback(ok, q, q.ans);
}

const PRAISE = ['Brilliant! 🎉', 'Spot on! ✅', 'Great work! 🌟', 'Nailed it! 💪', 'Correct! 👏'];

function feedback(ok, q, rightText) {
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${ok ? 'good' : 'bad'}"><b>${ok ? pick(PRAISE) : 'Not quite – the answer is: ' + esc(rightText)}</b><br>${esc(q.why)}</div>
  ${speakBtn((ok ? 'Correct. ' : 'The answer is ' + rightText + '. ') + q.why)}<div style="height:10px"></div>
  <button class="btn primary" onclick="nextQ()">${QZ.i + 1 < QZ.qs.length ? 'Next question →' : 'See my score'}</button>`;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function nextQ() {
  QZ.i++;
  if (QZ.i < QZ.qs.length) renderQ();
  else results();
}

function getAnsStr(q) {
  if (q.type === 'mc') return q.opts[q.correct];
  if (q.type === 'num') return q.ans + ' ' + q.unit;
  if (q.type === 'text') return q.ans;
  return '';
}

function results() {
  SPEAK = [];
  const n = QZ.qs.length;
  const pct = Math.round(QZ.score / n * 100);
  let msg = pct >= 90 ? 'Amazing! You are ready! 🏆' : pct >= 70 ? 'Really good! Fix the few you missed. ⭐' : pct >= 50 ? 'Good start. Go back over the topics below. 👍' : 'Keep going! Read the Learn pages, then try again. 💪';

  if (QZ.mode === 'test' && currentExam) {
    const k = 'bestTest_' + currentExam;
    const b = store(k);
    if (b == null || pct > b) store(k, pct);
  }

  const byT = {};
  QZ.answers.forEach(a => {
    const t = a.q.topic;
    byT[t] = byT[t] || { r: 0, n: 0 };
    byT[t].n++;
    if (a.ok) byT[t].r++;
  });
  const wrong = QZ.answers.filter(a => !a.ok);
  const weak = Object.entries(byT).filter(([t, v]) => v.r / v.n < 0.75).map(([t]) => t);

  // Safely build the HTML strings without deep inline template literals
  let topicsHtml = Object.entries(byT).map(([t, v]) => {
    const p = Math.round(v.r / v.n * 100);
    const ti = ALL_TOPICS[t] || { ico: '📌', name: t };
    const bg = p >= 75 ? '#16a34a' : (p >= 50 ? '#f59e0b' : '#dc2626');
    return `<p style="margin:.5em 0 .2em">${ti.ico} ${ti.name}: <b>${v.r}/${v.n}</b></p><div class="bar"><i style="width:${p}%;background:${bg}"></i></div>`;
  }).join('');

  let weakHtml = '';
  if (weak.length && currentExam === 'sci-apparatus') {
    const buttons = weak.map(t => `<button class="pill" onclick="learn('${t}')">${ALL_TOPICS[t].name}</button>`).join(' ');
    weakHtml = `<div class="tip">📌 Work on: ${buttons}</div>`;
  }

  let mistakesHtml = '';
  if (wrong.length) {
    const wlist = wrong.map(a => {
      const qImg = a.q.img ? `<div class="qimg">${a.q.img}</div>` : '';
      return `<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px">
        <p><b>${esc(a.q.q)}</b></p>${qImg}
        <p>❌ You said: ${esc(a.given)}<br>✅ Answer: <b>${esc(getAnsStr(a.q))}</b></p>
        <p class="small">${esc(a.q.why)}</p>
      </div>`;
    }).join('');
    mistakesHtml = `<div class="card"><h3 style="margin-top:0">Check your mistakes</h3>${wlist}</div>
    <button class="btn primary" onclick="redoMistakes()">Try my mistakes again 🔁</button>`;
  }

  const retryAction = QZ.mode === 'test' ? 'startTest()' : `practise('${QZ.topic}')`;
  const retryLabel = QZ.mode === 'test' ? 'Take another mock test' : 'Practise again (new questions)';

  show(`<h2>${QZ.mode === 'test' ? '📝 Test results' : '✏️ Practice done'}</h2>
  <div class="card"><div class="big-score">${QZ.score} / ${n}</div><p style="text-align:center"><b>${pct}%</b> – ${msg}</p></div>
  <div class="card"><h3 style="margin-top:0">Score by topic</h3>${topicsHtml}${weakHtml}</div>
  ${mistakesHtml}
  <button class="btn" onclick="${retryAction}">${retryLabel}</button>
  <button class="btn ghost" onclick="examHome()">← Back to Exam</button>`);
  
  QZ.wrong = wrong.map(a => a.q);
}

function redoMistakes() { 
  const qs = shuffle(QZ.wrong); 
  QZ = { mode: 'practice', topic: QZ.topic || 'mix', qs, i: 0, score: 0, answers: [] }; 
  renderQ(); 
}

function MCq(q,right,wrongs){ return {q,right,opts:shuffle([right,...wrongs])}; }
let LB=null;
function labMenu(){
  SPEAK=[];
  show(`<h2>📈 Graph Lab</h2><p>Draw the graph yourself by <b>tapping</b> on the grid.</p>
  <div class="menu">${LAB.map((t,i)=>`<button class="btn" onclick="labStart(${i})"><span class="ico">${t.kind==='bar'?'📊':'📈'}</span><span><b>${t.title}</b><small>${t.kind==='bar'?'Bar chart':'Line graph'}</small></span></button>`).join('')}</div>
  <button class="btn ghost" onclick="examHome()">← Back</button>`);

function labStart(i){ LB={i,t:LAB[i],step:0,marks:{}}; labRender(); }
function labTable(t){
  const xs=t.kind==='bar'?t.labels:t.xs;
  return `<table><tr><th>${esc(t.xL)}</th>${xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>${esc(t.yL)}</th>${t.ys.map(y=>`<td>${y}</td>`).join('')}</tr></table>`;

function labRender(){
  SPEAK=[];
  const t=LB.t;
  let h=`<h2>${t.kind==='bar'?'📊':'📈'} ${t.title}</h2><div class="card"><p><b>Results:</b></p>${labTable(t)}</div>`;

  } else if(LB.step===1){

  } else {

  show(h);
  if(LB.step===1){ labBind(); labDraw(); }
}
function labChartOpts(final){
  const t=LB.t;
  const o={id:'lab',type:t.kind,yMax:t.yMax,yStep:t.yStep,yMinor:t.snap<t.yStep?t.snap:null,xL:t.xL,yL:t.yL,title:t.title,h:300};
  if(t.kind==='bar'){ o.labels=t.labels; o.ys=final?t.ys:[]; }
  else { o.xMax=t.xMax; o.xStep=t.xStep; if(final){o.xs=t.xs;o.ys=t.ys;o.fit=t.fit;} }
  LB.o=o; return o;
}
function labPre(i){
  const t=LB.t, ok=t.pre.opts[i]===t.pre.right;
  document.getElementById('lp'+i).classList.add(ok?'right':'wrong');
  document.getElementById('fb').innerHTML= ok?`<div class="fb good"><b>${pick(PRAISE)}</b></div><button class="btn primary" onclick="LB.step=1;labRender()">Now draw it →</button>`:`<div class="fb bad">Not quite. Remember: x-axis = what you <b>change</b>. Bar chart = <b>words</b>. Line graph = <b>numbers</b>. Try again.</div>`;
}
function labPost(i){
  const t=LB.t, ok=t.post.opts[i]===t.post.right;
  document.getElementById('lq'+i).classList.add(ok?'right':'wrong');
  document.getElementById('fb').innerHTML= ok?`<div class="fb good"><b>${pick(PRAISE)} Graph complete!</b></div><button class="btn primary" onclick="labStart(${(LB.i+1)%LAB.length})">Next graph →</button>`:`<div class="fb bad">Not quite. Look at the graph again and try another answer.</div>`;
}
function labBind(){
  const svg=document.getElementById('lab');
  svg.addEventListener('pointerdown',e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    const g=LB.o._geo, t=LB.t;
    if(p.x<g.L-4||p.x>g.L+g.pw+4||p.y<g.T-8||p.y>g.T+g.ph+8) return;
    let yv=(g.T+g.ph-p.y)/g.ph*(g.yMax-g.yMin)+g.yMin; yv=Math.max(0,Math.min(g.yMax,Math.round(yv/t.snap)*t.snap));
    if(t.kind==='bar'){ const idx=Math.floor((p.x-g.L)/g.band); if(idx<0||idx>=t.labels.length) return; LB.marks[idx]=yv; }
    else { let xv=(p.x-g.L)/g.pw*(g.xMax-g.xMin)+g.xMin; xv=Math.round(xv/t.xStep)*t.xStep; if(xv<g.xMin||xv>g.xMax) return; if(LB.marks[xv]===yv) delete LB.marks[xv]; else LB.marks[xv]=yv; }
    labDraw();
  });
}
function labDraw(){
  const g=LB.o._geo, t=LB.t, m=document.getElementById('lab-marks'); let s='';
  if(t.kind==='bar'){ const bw=g.band*0.6; for(const k in LB.marks){ const cx=g.L+g.band*k+g.band/2, y=LB.marks[k]; if(y>0) s+=`<rect x="${cx-bw/2}" y="${g.Y(y)}" width="${bw}" height="${g.Y(0)-g.Y(y)}" fill="#5b8def" stroke="#1d3557" stroke-width="1.2"/>`; s+=`<text x="${cx}" y="${g.Y(y)-5}" text-anchor="middle" font-size="10" fill="#1d4ed8">${y}</text>`; } }
  else { for(const k in LB.marks){ const px=g.X(+k), py=g.Y(LB.marks[k]); s+=`<path d="M${px-6} ${py-6}L${px+6} ${py+6}M${px+6} ${py-6}L${px-6} ${py+6}" stroke="#1d4ed8" stroke-width="2.6"/>`; } }
  m.innerHTML=s;
}
function labCheck(){
  const t=LB.t; let wrong=[], missing=[], extra=[];
  if(t.kind==='bar'){ t.labels.forEach((l,i)=>{ if(LB.marks[i]==null) missing.push(l); else if(LB.marks[i]!==t.ys[i]) wrong.push(`${l} (you drew ${LB.marks[i]}, it should be ${t.ys[i]})`); }); }
  else { t.xs.forEach((x,i)=>{ if(LB.marks[x]==null) missing.push(x); else if(LB.marks[x]!==t.ys[i]) wrong.push(`at ${x} (you put ${LB.marks[x]}, it should be ${t.ys[i]})`); });
         for(const k in LB.marks){ if(!t.xs.includes(+k)) extra.push(k); } }
  const fb=document.getElementById('fb');
  if(!wrong.length&&!missing.length&&!extra.length){
    fb.innerHTML=`<div class="fb good"><b>${pick(PRAISE)} Every ${t.kind==='bar'?'bar':'cross'} is correct!</b>${t.kind==='line'?'<br>Next, we add a line of best fit.':''}</div><button class="btn primary" onclick="LB.step=2;labRender()">Continue →</button>`;
  } else {
    let s='<div class="fb bad"><b>Nearly! Check these:</b><ul>';
    if(missing.length) s+=`<li>Missing: ${missing.join(', ')}</li>`;
    wrong.forEach(w=>s+=`<li>${w}</li>`);
    if(extra.length) s+=`<li>Extra cross at ${extra.join(', ')} – there is no result there. Tap it to remove it.</li>`;
    s+='</ul>Tip: count the small squares carefully. Each small line is worth <b>'+t.snap+'</b>.</div>';
    fb.innerHTML=s;
  }
}
